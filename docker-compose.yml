services:
  app:
    image: wecom-agent
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-ca7kangnvcl9wf.xuanyuan.run/library/node:20-alpine}
    restart: always
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/wecom-platform.db
      - API_PORT=3000
      - WEB_DIST_DIR=/app/apps/web/dist
      - BOT_AUTO_START_CONCURRENCY=${BOT_AUTO_START_CONCURRENCY:-3}
      - BOT_MESSAGE_CONCURRENCY=${BOT_MESSAGE_CONCURRENCY:-4}
      - BOT_QUEUE_BACKPRESSURE_LIMIT=${BOT_QUEUE_BACKPRESSURE_LIMIT:-10}
      - GENERATION_TASK_CONCURRENCY=${GENERATION_TASK_CONCURRENCY:-2}
    volumes:
      - api-data:/data
    ports:
      - "${WEB_PORT:-5173}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-data:
