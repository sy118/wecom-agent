services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DB_PATH=/data/wecom-platform.db
      - API_PORT=3000
      - WIKI_ROOT=/data/wiki
      - WIKI_MCP_URL=http://wiki-mcp:3001
    depends_on:
      - wiki-mcp
    volumes:
      - api-data:/data
      - wiki-data:/data/wiki
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wiki-mcp:
    build:
      context: .
      dockerfile: packages/wiki-mcp-server/Dockerfile
    restart: always
    environment:
      - WIKI_ROOT=/data/wiki
      - WIKI_MCP_PORT=3001
    volumes:
      - wiki-data:/data/wiki
    ports:
      - "${WIKI_MCP_PORT:-3001}:3001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-data:
  wiki-data:
